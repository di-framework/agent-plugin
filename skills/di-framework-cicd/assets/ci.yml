# Copy to .github/workflows/ci.yml. Third-party actions are pinned to commit SHAs;
# Dependabot (assets/dependabot.yml) keeps them current.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Uncomment when `bun run build` emits through @di-framework/tsc (first build compiles a Go sidecar).
      # Pin actions/setup-go to a commit SHA before enabling.
      # - uses: actions/setup-go@<sha> # v6
      #   with:
      #     go-version: '1.26'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test --coverage

      - name: Build
        run: bun run build
